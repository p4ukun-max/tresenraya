<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tres en raya</title>

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at top, rgba(255,255,255,0.15), transparent 40%),
      linear-gradient(135deg, #1a0033, #330066);
    color:#fff;
    font-family:'Comic Sans MS', Arial;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    padding-top:20px;
}

/* ✨ Confeti */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:1;
    background-image:
      radial-gradient(#ffd700 1px, transparent 1px),
      radial-gradient(#ff66cc 1px, transparent 1px),
      radial-gradient(#66ffcc 1px, transparent 1px);
    background-size: 80px 80px, 120px 120px, 160px 160px;
    animation: sparkle 25s linear infinite;
    opacity:0.35;
    pointer-events:none;
}

@keyframes sparkle{
    from{background-position:0 0,0 0,0 0;}
    to{background-position:800px 1200px,-800px 800px,600px -1000px;}
}

#game{
    position:relative;
    z-index:5;
    width:100%;
    max-width:360px;
}

h2{
    text-align:center;
    color:#ffd700;
    text-shadow:0 0 12px #ffea00;
    font-size:clamp(22px,6vw,32px);
}

#board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3vw;
    max-width:300px;
    width:90vw;
    margin:10px auto;
}

#board div{
    aspect-ratio:1/1;
    background:rgba(255,255,255,0.15);
    border-radius:15px;
    box-shadow:0 0 10px rgba(255,215,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(32px,10vw,46px);
    cursor:pointer;
    transition:0.2s;
    border:2px solid #e5a3da;
}

#board div:hover{
    transform:scale(1.08);
    box-shadow:0 0 22px #ffd700;
}

#status{
    text-align:center;
    font-size:clamp(14px,4vw,18px);
    margin-top:10px;
    white-space:pre-line;
    color:#ffddff;
}

#chibipau{
    width:min(40vw,120px);
    display:block;
    margin:8px auto 0;
}

/* 🔁 Botón reintentar */
#retry{
    display:none;
    margin:15px auto 0;
    padding:10px 22px;
    font-size:16px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#ffd700,#ff66cc);
    color:#330033;
    cursor:pointer;
    box-shadow:0 0 12px rgba(255,215,0,0.8);
}

#retry:hover{
    transform:scale(1.05);
}

/* 🎆 Fuegos */
.fireworks{
    position:fixed;
    inset:0;
    z-index:999;
    pointer-events:none;
    background:
      radial-gradient(circle,#fff 2px,transparent 3px),
      radial-gradient(circle,#ffd700 2px,transparent 3px),
      radial-gradient(circle,#ff66cc 2px,transparent 3px);
    background-size:10px 10px;
    animation:boom 0.8s infinite alternate;
}

@keyframes boom{
    from{opacity:0.3; transform:scale(1);}
    to{opacity:1; transform:scale(1.4);}
}
</style>
</head>

<body>

<div id="game">
  <h2>Tres en raya</h2>
  <div id="board"></div>
  <p id="status"></p>
  <img id="chibipau" src="neutral.png">
  <button id="retry" onclick="restart()">🔁 Reintentar</button>
</div>

<audio id="soundHuman" src="campanada.mp3"></audio>
<audio id="soundAI" src="copa.mp3"></audio>

<script>
let inicio, board, current, over, nivelDif;
const HUMAN="🔔", AI="🥂";
const winLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function restart(){
    inicio=true;
    board=Array(9).fill(null);
    current=HUMAN;
    over=false;
    nivelDif=Math.floor(Math.random()*3)+1;
    document.getElementById("retry").style.display="none";
    render();
}

function render(){
    const boardEl=document.getElementById("board");
    boardEl.innerHTML="";
    board.forEach((v,i)=>{
        const cell=document.createElement("div");
        cell.textContent=v||"";
        cell.onclick=()=>clickCell(i);
        boardEl.appendChild(cell);
    });

    const st=document.getElementById("status");
    const img=document.getElementById("chibipau");
    const res=checkWinner(board);

    if(res){
        over=true;
        document.getElementById("retry").style.display="block";
        if(res==="tie"){ st.textContent="Empate"; img.src="neutral.png"; }
        else if(res===AI){ st.textContent="Chibi Pau gana"; img.src="victoria.png"; }
        else{ st.textContent="¡Has ganado!\nChibi Pau triste..."; img.src="ko.png"; }
    } else {
        if(inicio){
            st.textContent=[
              "Vamos a jugar. Empieza tu cariño",
              "No te lo pondré fácil.\nTu turno Amor",
              "¡Este Chibi Pau va a por todas!\nTu turno Amor"
            ][nivelDif-1];
            inicio=false;
        } else {
            st.textContent=current===HUMAN?"Tu turno Amor":"Chibi Pau está pensando...";
            img.src=current===HUMAN?"neutral.png":"pensando.png";
        }
    }
}

function clickCell(i){
    if(over||board[i]||current!==HUMAN) return;
    board[i]=HUMAN;
    document.getElementById("soundHuman").play();
    next();
}

function next(){
    if(checkWinner(board)){ render(); return; }
    current=current===HUMAN?AI:HUMAN;
    render();
    if(current===AI) setTimeout(aiMove,1000);
}

function checkWinner(b){
    for(const l of winLines){
        const[a,c,d]=l;
        if(b[a]&&b[a]===b[c]&&b[a]===b[d]) return b[a];
    }
    return b.every(x=>x)?"tie":null;
}

function aiMove(){
    let move=nivelDif===1?randomMove():
             nivelDif===2?(tryWB(AI)??tryWB(HUMAN)??randomMove()):
             bestMove(board);
    board[move]=AI;
    document.getElementById("soundAI").play();
    next();
}

function tryWB(p){
    for(let i=0;i<9;i++){
        if(!board[i]){
            const c=board.slice(); c[i]=p;
            if(checkWinner(c)===p) return i;
        }
    }
}

function randomMove(){
    const f=board.map((v,i)=>v?null:i).filter(v=>v!==null);
    return f[Math.floor(Math.random()*f.length)];
}

function bestMove(b){
    let best=-Infinity,move;
    for(let i=0;i<9;i++){
        if(!b[i]){
            const c=b.slice(); c[i]=AI;
            const s=minimax(c,false);
            if(s>best){best=s;move=i;}
        }
    }
    return move;
}

function minimax(b,max){
    const w=checkWinner(b);
    if(w===AI) return 1;
    if(w===HUMAN) return -1;
    if(w==="tie") return 0;
    let best=max?-Infinity:Infinity;
    for(let i=0;i<9;i++){
        if(!b[i]){
            const c=b.slice(); c[i]=max?AI:HUMAN;
            const s=minimax(c,!max);
            best=max?Math.max(best,s):Math.min(best,s);
        }
    }
    return best;
}

restart();
</script>

</body>
</html>
